name: Update weather

on:
    schedule:
        - cron: '0 */3 * * *'  # every 3 hours
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                node-version: 22

            - name: Fetch weather from Openweather
              run: node tools/fetch-weather.mjs
              env:
                OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

            - name: Commit if changed
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
                git add data/weather.json
                git diff --staged --quiet || git commit -m "Update weather"
                git push